services:
  - type: web
    name: truck-routing-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi --workers 1 --threads 4 --timeout 90
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
